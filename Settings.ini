; --- LOGIC FOR BUTTON COLORS ---

[MeasureShadowState]
Measure=String
String=#LyricsShadow#
IfMatch=(?i)Shadow
IfMatchAction=[!SetOption MeterShadowOn FontColor "#AccentColor#"]
IfMatch2=(?i)None
IfMatchAction2=[!SetOption MeterShadowOff FontColor "#AccentColor#"]
UpdateDivider=-1

[MeasureLangState]
Measure=String
String=#LanguageFile#
IfMatch=(?i)^en$
IfMatchAction=[!SetOption MeterLangEN FontColor "#AccentColor#"]
IfMatch2=(?i)^pt-br$
IfMatchAction2=[!SetOption MeterLangPTBR FontColor "#AccentColor#"]
IfMatch3=(?i)^es$
IfMatchAction3=[!SetOption MeterLangES FontColor "#AccentColor#"]
IfMatch4=(?i)^it$
IfMatchAction4=[!SetOption MeterLangIT FontColor "#AccentColor#"]
IfMatch5=(?i)^de$
IfMatchAction5=[!SetOption MeterLangDE FontColor "#AccentColor#"]
IfMatch6=(?i)^fr$
IfMatchAction6=[!SetOption MeterLangFR FontColor "#AccentColor#"]
IfMatch7=(?i)^jp$
IfMatchAction7=[!SetOption MeterLangJP FontColor "#AccentColor#"]
UpdateDivider=-1