[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Variables]
@include=#ROOTCONFIGPATH#@Resources\Variables.inc
Pad=10
RowH=22
Row1Y=36
LabelColor=180,180,180,255
ValueColor=240,240,240,255
BgColor=20,20,20,230
AccentColor=90,170,255,255
ValueX=150
InputW=120
InputH=18
SwatchW=16
SwatchGap=6
RainRGBPath=#SKINSPATH#RainRGBExample\@Resources\Addons\RainRGB4.exe
RainRGBFile=#ROOTCONFIGPATH#@Resources\Variables.inc
RefreshTargets=STZLyrics | STZLyrics\Settings

[MeterBG]
Meter=Image
SolidColor=#BgColor#
X=0
Y=0
W=400
H=300

[MeterTitle]
Meter=String
Text=#L_Title#
X=#Pad#
Y=#Pad#
FontSize=12
FontColor=#ValueColor#
AntiAlias=1

[MeterFontSizeLabel]
Meter=String
Text=#L_FontSize#
X=#Pad#
Y=#Row1Y#
FontSize=10
FontColor=#LabelColor#
AntiAlias=1

[MeterFontSizeValue]
Meter=String
Text=#FontSize#
X=#ValueX#
Y=#Row1Y#
FontSize=10
FontColor=#ValueColor#
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureInputFontSize "ExecuteBatch 1"]

[MeasureInputFontSize]
Measure=Plugin
Plugin=InputText
X=#ValueX#
Y=#Row1Y#
W=#InputW#
H=#InputH#
SolidColor=255,255,255,255
FontColor=0,0,0,255
DefaultValue=#FontSize#
FocusDismiss=1
Command1=[!WriteKeyValue Variables FontSize "$UserInput$" "#ROOTCONFIGPATH#@Resources\Variables.inc"][!Refresh "STZLyrics" "STZLyrics.ini"][!Refresh]

[MeterFontFaceLabel]
Meter=String
Text=#L_FontFace#
X=#Pad#
Y=(#Row1Y#+#RowH#)
FontSize=10
FontColor=#LabelColor#
AntiAlias=1

[MeterFontFaceValue]
Meter=String
Text=#LyricsFont#
X=#ValueX#
Y=(#Row1Y#+#RowH#)
FontSize=10
FontColor=#ValueColor#
AntiAlias=1
