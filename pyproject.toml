[project]
name = "stzlyrics-overlay"
version = "1.2.0"
description = "Windows taskbar lyrics overlay using GSMTC + LRCLib"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "requests>=2.31",
  "winsdk>=1.0.0b10; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
build = [
  "pyinstaller>=6.0",
]

[project.scripts]
stzlyrics-overlay = "app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
app = ["assets/logo.ico"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

