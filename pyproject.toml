[project]
name = "stzlyrics-overlay"
version = "0.1.0"
description = "Windows taskbar lyrics overlay using GSMTC + LRCLib"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "requests>=2.31",
  "winsdk>=1.0.0b10; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
stzlyrics-overlay = "app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long log-format strings and localized (i18n) message strings are kept on one
# line intentionally; wrapping them hurts readability and they cannot be
# auto-fixed.
ignore = ["E501"]

